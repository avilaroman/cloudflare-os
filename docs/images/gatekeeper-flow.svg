<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Agente / Gadget -->
  <rect x="30" y="140" width="180" height="100" rx="12" fill="#F6821F"/>
  <text x="120" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">🤖 Agente</text>
  <text x="120" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">/ Gadget</text>

  <line x1="215" y1="190" x2="325" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gatekeeper -->
  <rect x="330" y="50" width="260" height="280" rx="14" fill="#FFF7ED" stroke="#1a1a2e" stroke-width="2"/>
  <text x="460" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">🛡️ Gatekeeper</text>

  <text x="355" y="125" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e">🔑 Autorización (OAuth)</text>
  <text x="355" y="160" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e">🎯 Acceso restringido</text>
  <text x="355" y="195" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e">📋 Registro de acciones</text>
  <text x="355" y="230" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e">✋ Aprobación humana</text>

  <line x1="595" y1="190" x2="685" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Servicio externo -->
  <rect x="690" y="140" width="180" height="100" rx="12" fill="#1a1a2e"/>
  <text x="780" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">🌐 Servicio</text>
  <text x="780" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">externo</text>

  <!-- Intervención humana -->
  <line x1="460" y1="330" x2="460" y2="355" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="460" cy="378" r="20" fill="#F6821F"/>
  <text x="460" y="384" text-anchor="middle" font-size="16">🙂</text>
  <text x="460" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a1a2e">✋ «¿Apruebo esta acción?»</text>
</svg>
